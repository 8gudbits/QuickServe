<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <title>QuickServe | Page Not Found</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/404.css" />
</head>

<body>
  <div class="error-panel">
    <div class="error-icon"><i class="fas fa-compass"></i></div>
    <span class="error-code">404</span>
    <h1 class="error-title" id="errorTitle">Page Not Found</h1>
    <p class="error-message" id="errorMessage">
      The page you're looking for doesn't exist or may have been moved. Please
      check the URL or return to the homepage.
    </p>
    <div class="button-group">
      <button onclick="history.back()" class="btn">
        <i class="fas fa-arrow-left"></i> Go Back
      </button>
      <a href="index.html" class="btn btn-secondary">
        <i class="fas fa-home"></i> Home
      </a>
    </div>
  </div>
</body>

</html>
